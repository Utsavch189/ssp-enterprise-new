{% extends 'base.html' %}

{% block title %}
Product Catalog
{% endblock %}

{% block body %}
<div class="max-w-7xl mx-auto px-4 py-8 min-h-screen">
    <!-- Search Bar -->
    <div class="mb-8">
        <div class="max-w-xl">
            <div class="relative">
                <input type="text" id="search"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Search products...">
                <button class="absolute right-2 top-2 text-gray-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="products">
        <p id="no-product-text" class="font-bold text-gray-400 text-xl hidden">No Products Found!</p>
        <!-- Product cards will be dynamically inserted here -->
    </div>

    <!-- Edit Modal -->
    {% include 'components/editmodal.html' %}

    <!-- Delete Modal -->
    {% include 'components/deletemodal.html' %}

    <!-- Loading Indicator -->
    <div id="loading" class="hidden mt-8 text-center">
        <div
            class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-blue-600 border-r-transparent">
        </div>
        <p class="mt-2 text-gray-600">Loading more products...</p>
    </div>
</div>

<script src="/static/js/catalog.js">
</script>
{% endblock %}
