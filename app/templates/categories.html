{% extends 'base.html' %}

{% block title %}
Product Categories
{% endblock %}

{% block styles %}
<style>
    :root {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
    }

    body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
    }

    /* Smooth scrolling for the whole page */
    html {
        scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
        background: #93c5fd;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #60a5fa;
    }
</style>
{% endblock %}

{% block body %}
<div id="app"></div>
<script src="/static/js/categories.js">
</script>
{% endblock %}
